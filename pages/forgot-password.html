<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar clave | Notas U</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <main class="auth-screen">
    <section class="auth-card">
      <div class="auth-brand">
        <img src="../assets/logo.svg" alt="Notas U" class="logo">
        <div>
          <strong>Notas U</strong>
          <span>Recuperacion de clave</span>
        </div>
      </div>

      <div>
        <p class="eyebrow">Clave</p>
        <h1>Recuperar acceso</h1>
      </div>

      <form id="forgotPasswordForm" class="auth-form">
        <label>
          Correo
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <button class="primary-button" type="submit">Enviar correo</button>
      </form>

      <form id="updatePasswordForm" class="auth-form hidden">
        <label>
          Nueva clave
          <input name="password" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="primary-button" type="submit">Actualizar clave</button>
      </form>

      <div class="auth-links">
        <a href="login.html">Volver al login</a>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../config.js"></script>
  <script type="module" src="../js/auth/forgot-password.js"></script>
</body>
</html>
