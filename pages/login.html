<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesion | Notas U</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <main class="auth-screen">
    <section class="auth-card">
      <div class="auth-brand">
        <img src="../assets/logo.svg" alt="Notas U" class="logo">
        <div>
          <strong>Notas U</strong>
          <span>Dashboard academico</span>
        </div>
      </div>

      <div>
        <p class="eyebrow">Acceso</p>
        <h1>Inicia sesion</h1>
      </div>

      <form id="loginForm" class="auth-form">
        <label>
          Correo
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label>
          Clave
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit">Entrar</button>
      </form>

      <div class="auth-links">
        <a href="register.html">Crear cuenta</a>
        <a href="forgot-password.html">Olvide mi clave</a>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../config.js"></script>
  <script type="module" src="../js/auth/login.js"></script>
</body>
</html>
